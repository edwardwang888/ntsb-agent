# Scan for committed secrets (API keys, tokens, private keys) with gitleaks.
# Runs on every push and pull request, and scans each commit's diff — not just
# the final tree — so a key added in one commit and deleted in the next is
# still caught.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # lets gitleaks comment on the offending PR line

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every commit in the push/PR is scanned
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
